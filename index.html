    <style>
      html { min-height: 100vh; }
      body {
        text-align: center;
        overflow-y: overlay;
        font-family: Helvetica;
        position: relative;
        width: 100%;
        min-height: 100vh;
        margin: 0;
        padding: 0;
        background: hsl(0, 0%, 12%);
      }
      #title {
        width: 100%;
        padding: 18px 0 42px;
        margin: 0;
        color: hsl(0, 0%, 86%);
        font-size: 24px;
        font-weight: bold;
      }
      .dnd {
        width: 100%;
        text-align: center;
        padding-bottom: 6px;
        box-sizing: border-box;
        font-size: 15px;
      }
      input, .item div, .dnd { color: hsl(0, 0%, 86%); }
      .item {
        position: relative;
        margin: 10px;
        padding: 12px 20px 20px;
        background: hsl(224, 29%, 10%);
        border: 1px solid hsl(224, 29%, 22%);
      }
      .remove { position: absolute; right: 10px; top: 10px; }
      textarea {
        width: calc(100% - 8px);
        max-width: calc(100% - 8px);
        margin: 2px 0px;
        height: 120px;
        font-family: Courier;
        font-size: 13px;
        cursor: auto;
        color: hsl(0, 0%, 86%);
        background: hsl(0, 0%, 14%);
        border: 1px solid hsl(224, 29%, 22%);
      }
      #results { position: relative; padding: 20px 50px; box-sizing: border-box; }
      #dropper { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
      #dropper.hover { background: lightblue; z-index: 100; }
      #file-picker { display: none; }
      #choose-files { position: absolute; width: 92px; left: 0; right: 0; top: 62px; margin: auto; z-index: 1; }
      .item>div {
        width: min-content;
        max-width: 100%;
        margin: 0 auto 4px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .copy-button { position: absolute; top: 10px; right: 140px; }
      .copy-css-button { position: absolute; top: 10px; right: 60px; }
      button {
        background-color: hsl(0, 0%, 9%);
        border: 1px solid hsl(0, 0%, 42%);
        border-radius: 1px;
        box-shadow: 0 0 0 1px #000;
        color: hsl(0, 0%, 86%);
        font: 13px Arial;
        padding: 2px 6px;
        outline: none;
      }
      button:hover, button:focus {
        background-color: hsl(0, 0%, 14%);
        border-color: hsl(0, 0%, 52%);
        color: hsl(0, 0%, 96%);
      }
    </style>
  </head>
  <body>
    <input id="file-picker" type="file" multiple></input>
    <div id="title">Base64 File Encoder</div>
    <div class="dnd">- or -</div>
    <div class="dnd">Drag & Drop</div>
    <div id="dropper"></div>
    <div id="results"></div>
    <script>
      if (typeof window.FileReader === 'undefined') alert('File API & FileReader not supported');
      var dropper = document.getElementById("dropper");
      var results = document.getElementById("results");
      var filePicker = document.getElementById('file-picker');

      dropper.ondragenter = function(e) { dropper.className = 'hover'; e.preventDefault(); };
      dropper.ondragover = function(e) { e.preventDefault(); };
      dropper.ondragleave = function(e) { dropper.className = ''; e.preventDefault(); };

      function compressImage(file, quality, mimeType) {
        return new Promise(function(resolve, reject) {
          var reader = new FileReader();
          reader.onload = function(e) {
            var img = new Image();
            img.onload = function() {
              var canvas = document.createElement('canvas');
              canvas.width = img.width;
              canvas.height = img.height;
              var ctx = canvas.getContext('2d');
              ctx.drawImage(img, 0, 0);
              resolve(canvas.toDataURL(mimeType, quality));
            };
            img.onerror = reject;
            img.src = e.target.result;
          };
          reader.onerror = reject;
          reader.readAsDataURL(file);
        });
      }

      async function processFiles(fileList) {
        var files = [].slice.call(fileList);
        for (const file of files) {
          // Compress raster images to WebP at 0.75 quality (preserves transparency, shrinks size)
          if (file.type.startsWith('image/') && file.type !== 'image/svg+xml') {
            try {
              var compressedDataUri = await compressImage(file, 0.75, 'image/webp');
              fileLoaded(file.name, compressedDataUri);
              continue;
            } catch (err) {
              console.warn('Compression skipped:', err);
            }
          }
          var reader = new FileReader();
          reader.onload = function(event) {
            fileLoaded(file.name, event.target.result);
          };
          reader.readAsDataURL(file);
        }
      }

      dropper.ondrop = function(e) {
        e.preventDefault();
        dropper.className = '';
        processFiles(e.dataTransfer.files);
      };
      filePicker.onchange = function() {
        processFiles(filePicker.files);
        filePicker.value = '';
      };

      var choose = document.createElement("button");
      choose.innerHTML = 'Choose Files';
      choose.id = 'choose-files';
      choose.onclick = function() { filePicker.click(); };
      document.body.appendChild(choose);

      function fileLoaded(filename, dataUri) {
        var div = document.createElement("div");
        div.className = 'item';
        var remove = document.createElement("button");
        remove.className = 'remove';
        remove.innerHTML = 'x';
        remove.onclick = function() {
          if (localStorage) localStorage.removeItem("b64-" + filename);
          results.removeChild(div);
        };
        div.appendChild(remove);

        if (/^data:image/.test(dataUri)) {
          var imgDiv = document.createElement("div");
          var img = document.createElement("img");
          img.src = dataUri;
          img.style['max-width'] = '100px';
          imgDiv.appendChild(img);
          div.appendChild(imgDiv);
        }

        var name = document.createElement("div");
        name.innerHTML = filename + ' (' + Math.round(dataUri.length / 1024 * 10) / 10 + ' KB)';
        div.appendChild(name);

        var ta = document.createElement("textarea");
        ta.onclick = function() { ta.select(); };
        ta.value = dataUri;
        div.appendChild(ta);

        var copy = document.createElement("button");
        copy.innerHTML = 'Copy';
        copy.className = 'copy-button';
        copy.onclick = function() { ta.select(); document.execCommand('copy'); };
        div.appendChild(copy);

        var copyCSS = document.createElement("button");
        copyCSS.innerHTML = 'Copy CSS';
        copyCSS.className = 'copy-css-button';
        copyCSS.onclick = function() {
          var temp = document.createElement('input');
          temp.setAttribute('value', 'background-image: url(' + ta.value + ');');
          document.body.appendChild(temp);
          temp.select();
          document.execCommand('copy');
          document.body.removeChild(temp);
        };
        div.appendChild(copyCSS);

        results.appendChild(div);
        if (localStorage) localStorage.setItem("b64-" + filename, dataUri);
      }

      if (localStorage)
        for (var filename in localStorage)
          if (filename.indexOf("b64-") === 0) fileLoaded(filename.replace("b64-", ""), localStorage.getItem(filename));
    </script>
  </body>
</html>
